[project]
name = "sop-pipeline"
version = "0.1.0"
description = "Self-contained pipeline: ingest a folder of inputs (transcripts + documents) and generate a structured SOP in markdown, flagging gaps instead of hallucinating."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.50.0",
    "python-docx>=1.1.0",
    "imageio-ffmpeg>=0.5.1",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0",
]

[project.scripts]
sop-pipeline = "sop_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sop_pipeline"]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # Pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "UP",      # pyupgrade
    "S",       # flake8-bandit (security)
    "PLC0415", # import-outside-top-level
]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101"]  # asserts are expected in tests
"integration_tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["sop_pipeline"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
force-single-line = false
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
